# Only the root: without this, pnpm takes every package.json under vendor for a workspace project.
packages:
  - "."
engineStrict: true
# Otherwise an install after `pnpm install --prod` is skipped as a repeat, leaving the dev
# dependencies out.
optimisticRepeatInstall: false
# 4 days (in minutes)
minimumReleaseAge: 5760
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
