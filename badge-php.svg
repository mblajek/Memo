<svg xmlns="http://www.w3.org/2000/svg" width="86" height="20" role="img"
     font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" fill="#fff" text-anchor="middle">
  <title>Lines of backend code</title>
  <linearGradient id="shine" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="round"><rect width="100%" height="100%" rx="3"/></clipPath>
  <g clip-path="url(#round)">
    <svg width="31" height="100%">
      <rect width="100%" height="100%" fill="#555"/>
      <text x="50%" y="14">PHP</text>
    </svg>
    <!-- The count box is wide enough for six digits. -->
    <svg x="31" width="55" height="100%">
      <rect width="100%" height="100%" fill="#777bb3"/>
      <text x="50%" y="14">
        <!-- LINE_COUNT_HERE -->30&#8201;088
      </text>
    </svg>
    <rect width="100%" height="100%" fill="url(#shine)"/>
  </g>
</svg>
